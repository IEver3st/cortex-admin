# ES Admin Permissions Configuration
# Add this to your server.cfg: exec resources/[eco]/cortex-admin/permissions.cfg

# Grant all admin permissions to everyone (for development/testing)
# IMPORTANT: Remove or modify this for production servers!
# add_ace builtin.everyone "cortex-admin.all" allow
# add_ace builtin.everyone "command.esadmin" allow

# Alternative: Restrict to admin group only
add_ace group.admin "cortex-admin.all" allow
add_ace group.admin "command.esadmin" allow
# Optional parity aliases if you prefer explicit grants instead of cortex-admin.all:
# add_ace group.admin "cortex-admin.appearance" allow
# add_ace group.admin "cortex-admin.favorites" allow
# add_principal identifier.steam:YOUR_STEAM_HEX group.admin
