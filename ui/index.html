<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>es_admin</title>
    <script src="preview-shim.js?v=es-admin-preview-1"></script>
    <link rel="stylesheet" href="style.css?v=es-admin-ui-7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;510;590&family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const debug = params.get('debug') === '1';

            const reactSrc = debug
                ? 'https://unpkg.com/react@18.2.0/umd/react.development.js'
                : 'https://unpkg.com/react@18.2.0/umd/react.production.min.js';

            const reactDomSrc = debug
                ? 'https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js'
                : 'https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js';

            const react = document.createElement('script');
            react.src = reactSrc;
            react.crossOrigin = 'anonymous';
            react.onload = function () {
                const reactDom = document.createElement('script');
                reactDom.src = reactDomSrc;
                reactDom.crossOrigin = 'anonymous';
                document.head.appendChild(reactDom);
            };
            document.head.appendChild(react);
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script>
        (function () {
            function boot() {
                if (window.React && window.ReactDOM) {
                    const app = document.createElement('script');
                    app.src = 'app.js?v=es-admin-ui-6';
                    document.body.appendChild(app);
                    return;
                }
                setTimeout(boot, 10);
            }
            boot();
        })();
    </script>
</body>
</html>
